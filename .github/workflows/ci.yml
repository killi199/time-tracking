name: CI

on:
    push:
        branches:
            - 'main'
    pull_request:
        types: [opened, synchronize, reopened]
        branches:
            - 'main'

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                variant: [default, foss]

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Environment and Install Dependencies
              uses: ./.github/actions/setup-environment
              with:
                  variant: ${{ matrix.variant }}

            - name: Prettier
              if: matrix.variant == 'default'
              run: npx prettier . --check

            - name: Yarn Dedupe Check
              if: matrix.variant == 'default'
              run: yarn dedupe --check

            - name: Typecheck
              run: ${{ matrix.variant == 'default' && 'yarn typecheck' || 'yarn typecheck:foss' }}

            - name: Lint
              if: matrix.variant == 'default'
              run: yarn lint

            - name: Expo Doctor
              if: matrix.variant == 'default'
              run: npx expo-doctor

            - name: Test
              if: matrix.variant == 'default'
              run: yarn test --ci --coverage --reporters=default --reporters=jest-junit

            - name: Upload test results to Codecov
              if: ${{ !cancelled() && matrix.variant == 'default' }}
              uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  report_type: test_results

            - name: Upload coverage reports to Codecov
              if: matrix.variant == 'default'
              uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}

            - name: Build
              run: ${{ matrix.variant == 'default' && 'yarn build' || 'yarn build:foss' }}
